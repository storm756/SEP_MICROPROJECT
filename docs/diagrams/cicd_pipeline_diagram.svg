<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480" width="100%" height="100%" style="background:#0b132b; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="575" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">CityServe Automated DevSecOps CI/CD Pipeline (Jenkins)</text>
  <text x="575" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">End-to-End Shift-Left Security Pipeline: Code → Unit Tests → SAST → SCA → Image Gate → Deploy</text>

  <!-- Stage Box Template Macro -->
  <!-- 1. Code Commit -->
  <g transform="translate(40, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#0284c7"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">💻</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1. SCM Push</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Git &amp; GitHub</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">Branch: main</text>
    <text x="57" y="148" text-anchor="middle" fill="#cbd5e1" font-size="9">Commit &amp; PR</text>
  </g>

  <!-- Connector -->
  <line x1="155" y1="200" x2="175" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="175,196 182,200 175,204" fill="#64748b"/>

  <!-- 2. Test Stage -->
  <g transform="translate(182, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#059669"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">🧪</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2. Unit Tests</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Pytest &amp; Coverage</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#10b981" font-size="9" font-weight="600">20/20 Passed</text>
    <text x="57" y="148" text-anchor="middle" fill="#a7f3d0" font-size="9">99% Coverage</text>
  </g>

  <!-- Connector -->
  <line x1="297" y1="200" x2="317" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="317,196 324,200 317,204" fill="#64748b"/>

  <!-- 3. SAST SonarQube -->
  <g transform="translate(324, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#6366f1" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#4f46e5"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">🔍</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3. SAST Scan</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">SonarQube</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#818cf8" font-size="9" font-weight="600">Static Code Analysis</text>
    <text x="57" y="148" text-anchor="middle" fill="#cbd5e1" font-size="9">Quality Gate</text>
  </g>

  <!-- Connector -->
  <line x1="439" y1="200" x2="459" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="459,196 466,200 459,204" fill="#64748b"/>

  <!-- 4. SCA Trivy FS -->
  <g transform="translate(466, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#d97706"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">🛡️</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">4. SCA &amp; Secrets</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Trivy Filesystem</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">Dependency CVEs</text>
    <text x="57" y="148" text-anchor="middle" fill="#cbd5e1" font-size="9">API Token Audit</text>
  </g>

  <!-- Connector -->
  <line x1="581" y1="200" x2="601" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="601,196 608,200 601,204" fill="#64748b"/>

  <!-- 5. Docker Build -->
  <g transform="translate(608, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#0ea5e9" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#0284c7"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">🐳</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">5. Docker Build</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Container Engine</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">python:3.12-slim</text>
    <text x="57" y="148" text-anchor="middle" fill="#cbd5e1" font-size="9">Non-root appuser</text>
  </g>

  <!-- Connector -->
  <line x1="723" y1="200" x2="743" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="743,196 750,200 743,204" fill="#64748b"/>

  <!-- 6. Trivy Image Scan + Quality Gate -->
  <g transform="translate(750, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#ef4444" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#b91c1c"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">🚨</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">6. Image Gate</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Trivy Image Scan</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#f87171" font-size="9" font-weight="600">Break on Critical</text>
    <text x="57" y="148" text-anchor="middle" fill="#cbd5e1" font-size="9">OS Package Scan</text>
  </g>

  <!-- Connector -->
  <line x1="865" y1="200" x2="885" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="885,196 892,200 885,204" fill="#64748b"/>

  <!-- 7. IaC Scan -->
  <g transform="translate(892, 110)">
    <rect width="115" height="180" rx="10" fill="#1c2541" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="57" cy="40" r="18" fill="#7e22ce"/>
    <text x="57" y="46" text-anchor="middle" fill="#fff" font-size="16">🏗️</text>
    <text x="57" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">7. IaC Scan</text>
    <text x="57" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Terraform Policy</text>
    <rect x="10" y="115" width="95" height="50" rx="6" fill="#0b132b"/>
    <text x="57" y="133" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="600">Trivy Config</text>
    <text x="57" y="148" text-anchor="middle" fill="#cbd5e1" font-size="9">SG &amp; IMDSv2 Check</text>
  </g>

  <!-- Connector -->
  <line x1="1007" y1="200" x2="1027" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="1027,196 1034,200 1027,204" fill="#64748b"/>

  <!-- 8. Deployment -->
  <g transform="translate(1034, 110)">
    <rect width="80" height="180" rx="10" fill="#1c2541" stroke="#22c55e" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="40" cy="40" r="18" fill="#15803d"/>
    <text x="40" y="46" text-anchor="middle" fill="#fff" font-size="16">🚀</text>
    <text x="40" y="78" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">8. Deploy</text>
    <text x="40" y="96" text-anchor="middle" fill="#94a3b8" font-size="9">Docker / AWS</text>
    <rect x="8" y="115" width="64" height="50" rx="6" fill="#0b132b"/>
    <text x="40" y="133" text-anchor="middle" fill="#4ade80" font-size="8" font-weight="600">Healthcheck</text>
    <text x="40" y="148" text-anchor="middle" fill="#cbd5e1" font-size="8">Port 80/8000</text>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="40" y="330" width="1074" height="110" rx="10" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="360" fill="#38bdf8" font-size="13" font-weight="700">DevSecOps Security &amp; Compliance Highlights:</text>
  <text x="65" y="385" fill="#f8fafc" font-size="11">• <tspan font-weight="600" fill="#10b981">Shift-Left Quality:</tspan> 20 Automated Pytest verification checks run prior to containerization.</text>
  <text x="65" y="405" fill="#f8fafc" font-size="11">• <tspan font-weight="600" fill="#818cf8">SAST &amp; Code Smells:</tspan> SonarQube analyzes Flask routes, parameterized queries, and code hotspots.</text>
  <text x="65" y="425" fill="#f8fafc" font-size="11">• <tspan font-weight="600" fill="#f87171">Defense in Depth:</tspan> Trivy inspects dependencies, base image layers, and Terraform IaC definitions.</text>
  <text x="650" y="385" fill="#f8fafc" font-size="11">• <tspan font-weight="600" fill="#38bdf8">Least Privilege:</tspan> Container executed under unprivileged appuser (UID 10001).</text>
  <text x="650" y="405" fill="#f8fafc" font-size="11">• <tspan font-weight="600" fill="#c084fc">Cloud Hardening:</tspan> AWS EC2 enforces IMDSv2, EBS encryption, and restricted SG rules.</text>
  <text x="650" y="425" fill="#f8fafc" font-size="11">• <tspan font-weight="600" fill="#4ade80">Continuous Liveness:</tspan> Automated Docker Healthcheck polls /api/categories every 15s.</text>
</svg>
