<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CityServe - Smart City Service Application</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mut:#6b7a89;--pri:#0b6bcb;--bd:#dde3ea}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0b3a6e;color:#fff;padding:14px 24px}header h1{margin:0;font-size:20px}header small{opacity:.8}
main{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;gap:16px;grid-template-columns:320px 1fr}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
h2{margin:0 0 10px;font-size:16px}label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input,select,textarea,button{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font:inherit}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;margin-top:12px}button.sm{width:auto;margin:0;padding:4px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#eef4fb;border-radius:8px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.issue{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e8edf3;margin-right:4px}
.Critical{background:#fde0e0;color:#a10}.High{background:#ffe9cc;color:#a50}.Medium{background:#fff6c7;color:#760}.Low{background:#dff5e1;color:#164}
.row{display:flex;gap:8px;margin-bottom:10px}.err{color:#b00020;font-size:13px;margin-top:8px}
</style></head><body>
<header><h1>CityServe</h1><small>Smart City Service Application · SDG 9 / SDG 11</small></header>
<main>
<section class="card"><h2>Report an issue</h2>
<label>Title</label><input id="title">
<label>Category</label><select id="category"></select>
<label>Location</label><input id="location" placeholder="e.g. Ward 12, Link Road">
<label>Severity</label><select id="severity"><option>low</option><option selected>medium</option><option>high</option></select>
<label>People affected</label><input id="affected" type="number" min="1" value="5">
<label>Description</label><textarea id="description" rows="3"></textarea>
<button onclick="submitIssue()">Submit report</button><div id="err" class="err"></div></section>
<section><div class="stats" id="stats"></div>
<div class="card"><h2>Issues (sorted by priority)</h2>
<div class="row"><select id="fstatus" onchange="load()"><option value="">All statuses</option><option>Reported</option><option>Assigned</option><option>In Progress</option><option>Resolved</option></select></div>
<div id="list"></div></div></section></main>
<script>
const S=["Reported","Assigned","In Progress","Resolved"];const $=i=>document.getElementById(i);
const CATEGORIES_DATA={
  "water_leak":{department:"Water Dept",base:4,sla_hours:24},
  "power_outage":{department:"Electricity Dept",base:5,sla_hours:12},
  "pothole":{department:"Roads Dept",base:3,sla_hours:72},
  "streetlight":{department:"Electricity Dept",base:2,sla_hours:96},
  "waste":{department:"Sanitation Dept",base:3,sla_hours:48},
  "traffic":{department:"Traffic Police",base:4,sla_hours:24}
};
const SEVERITY_BONUS={low:0,medium:1,high:2};
const DEFAULT_ISSUES=[
  {id:1,title:'Severe Main Pipe Leak',category:'water_leak',location:'Ward 4, MG Road near City Hospital',severity:'high',affected:150,description:'High pressure drinking water pipe burst flooding road.',priority:9,priority_label:'Critical',department:'Water Dept',status:'Assigned',sla_hours:24},
  {id:2,title:'Traffic Signal Outage at Junction 7',category:'traffic',location:'Sector 12 / Central Avenue Crossing',severity:'high',affected:250,description:'Signal system completely down during peak rush hour.',priority:9,priority_label:'Critical',department:'Traffic Police',status:'Reported',sla_hours:24},
  {id:3,title:'Deep Pothole Causing Vehicle Damage',category:'pothole',location:'North Ring Road near Exit 3',severity:'medium',affected:45,description:'Pothole approximately 15cm deep posing hazard.',priority:5,priority_label:'Medium',department:'Roads Dept',status:'In Progress',sla_hours:72},
  {id:4,title:'Garbage Overflow at Community Bin',category:'waste',location:'Ward 9, Market Complex Area',severity:'medium',affected:80,description:'Municipal collection bin unemptied for 3 days.',priority:5,priority_label:'Medium',department:'Sanitation Dept',status:'Reported',sla_hours:48},
  {id:5,title:'Flickering Streetlights',category:'streetlight',location:'Ward 2, Green Park Avenue',severity:'low',affected:15,description:'Three consecutive lampposts blinking intermittently.',priority:3,priority_label:'Low',department:'Electricity Dept',status:'Resolved',sla_hours:96}
];
let useLocalMock=false;
let localIssues=JSON.parse(localStorage.getItem('cityserve_issues')||'null')||DEFAULT_ISSUES;
function saveLocal(){try{localStorage.setItem('cityserve_issues',JSON.stringify(localIssues))}catch(e){}}
function computePriority(c,s,a){const b=(CATEGORIES_DATA[c]||{}).base||3;const r=a>=100?2:(a>=10?1:0);return Math.min(10,b+(SEVERITY_BONUS[s]||0)+r+(s==="high"?1:0))}
function label(p){return p>=8?"Critical":p>=6?"High":p>=4?"Medium":"Low"}

async function api(u,o){
  if(useLocalMock)return mockApi(u,o);
  try{
    const r=await fetch(u,o);
    if(!r.ok&&u.includes('/api/categories'))throw new Error('API unavailable');
    return{ok:r.ok,data:await r.json()};
  }catch(e){
    useLocalMock=true;
    return mockApi(u,o);
  }
}

function mockApi(u,o){
  if(u.includes('/api/categories'))return{ok:true,data:CATEGORIES_DATA};
  if(u.includes('/api/issues')&&(!o||o.method==='GET'||!o.method)){
    let f=[...localIssues];const m=u.match(/status=([^&]+)/);
    if(m)f=f.filter(i=>i.status===decodeURIComponent(m[1]));
    f.sort((a,b)=>b.priority-a.priority);return{ok:true,data:f};
  }
  if(u.includes('/api/stats')){
    const op=localIssues.filter(i=>i.status!=='Resolved');
    return{ok:true,data:{total:localIssues.length,open:op.length,resolved:localIssues.length-op.length,critical_open:op.filter(i=>i.priority_label==='Critical').length}};
  }
  if(u.includes('/status')&&o&&o.method==='PATCH'){
    const id=parseInt(u.split('/api/issues/')[1].split('/status')[0]);
    const b=JSON.parse(o.body||'{}');const it=localIssues.find(i=>i.id===id);
    if(it){it.status=b.status;saveLocal();return{ok:true,data:it};}
    return{ok:false,data:{error:'not found'}};
  }
  if(u.includes('/api/issues')&&o&&o.method==='POST'){
    const b=JSON.parse(o.body||'{}');const aff=parseInt(b.affected||1);
    const p=computePriority(b.category,b.severity,aff);
    const it={id:Date.now(),title:b.title,category:b.category,location:b.location,severity:b.severity,affected:aff,description:b.description||'',priority:p,priority_label:label(p),department:(CATEGORIES_DATA[b.category]||{}).department||'City Dept',status:'Reported',sla_hours:(CATEGORIES_DATA[b.category]||{}).sla_hours||48};
    localIssues.unshift(it);saveLocal();return{ok:true,data:it};
  }
  return{ok:true,data:{}};
}

async function init(){const c=(await api('/api/categories')).data;$('category').innerHTML=Object.keys(c).map(k=>`<option value="${k}">${k.replace('_',' ')} → ${c[k].department}</option>`).join('');load()}
async function submitIssue(){const b={};['title','category','location','severity','description'].forEach(k=>b[k]=$(k).value);b.affected=$('affected').value;
const r=await api('/api/issues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
$('err').textContent=r.ok?'':(r.data.errors||[]).join(', ');if(r.ok){$('title').value='';$('location').value='';$('description').value='';load()}}
async function move(id,s){await api(`/api/issues/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}
async function load(){const f=$('fstatus').value;const[l,s]=await Promise.all([api('/api/issues'+(f?`?status=${f}`:'')),api('/api/stats')]);const t=s.data;
$('stats').innerHTML=[['Total',t.total],['Open',t.open],['Resolved',t.resolved],['Critical open',t.critical_open]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
$('list').innerHTML=l.data.map(i=>{const n=S[S.indexOf(i.status)+1];return`<div class="issue"><div><b>${i.title}</b><br><span class="tag ${i.priority_label}">${i.priority_label} (${i.priority})</span><span class="tag">${i.department}</span><span class="tag">${i.status}</span><br><small>${i.location} · ${i.affected} affected · SLA ${i.sla_hours}h</small></div>${n?`<button class="sm" onclick="move(${i.id},'${n}')">→ ${n}</button>`:''}</div>`}).join('')||'<p>No issues.</p>'}
init();
</script></body></html>
