# SonarQube Scanner Configuration for CityServe
sonar.projectKey=CityServe
sonar.projectName=CityServe - Smart City Service Application
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=.
sonar.inclusions=app.py,wsgi.py
sonar.tests=.
sonar.test.inclusions=test_app.py

# Python Coverage Report path
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
